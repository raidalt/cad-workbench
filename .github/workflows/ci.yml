name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Packaged workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libfontconfig1 fonts-dejavu-core
      - run: npm ci
        working-directory: web-chat
      - run: node scripts/export-digest.mjs && npm run typecheck && npm run build
        working-directory: web-chat
      - run: npx playwright install --with-deps chromium
        working-directory: web-chat
      - run: node web-chat/tests/download-smoke.mjs
      - name: Exercise hosted jobs with the installed native CAD runtime
        working-directory: hosted
        run: npm ci && CAD_TEST_PYTHON="$GITHUB_WORKSPACE/.local-cad/venv/bin/python" npm test

  rust:
    name: Rust (fmt, clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: System libraries (OpenGL for OCP, X11 for gmsh, a font for text)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libegl1 libxrender1 libxcursor1 \
            libxft2 libxinerama1 libxi6 libxkbcommon0 libfontconfig1 fonts-dejavu-core
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Python environment (with the optional stress-analysis packages)
        run: uv sync --locked
      - name: Build the cad client and cadd daemon (the daemon tests use them)
        run: cargo build --release
      - name: Tests
        run: uv run --locked pytest -q -ra --junitxml=junit.xml
      - name: Report failed tests as annotations
        if: failure()
        run: python3 scripts/junit_annotations.py junit.xml
      - name: CLI smoke test through the daemon
        run: |
          export PATH="$PWD/target/release:$PATH"
          cad capabilities
          cad examples copy servo_arm "$RUNNER_TEMP/arm"
          cd "$RUNNER_TEMP/arm"
          cad build
          cad fea -q draft || [ $? -eq 4 ]   # 4 = a study is below its target (expected for this example)
          cad render --fea pushrod --quality draft --views iso --no-sheet
          cad daemon stop

  core-without-fea:
    name: Core install without the optional FEA packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libfontconfig1 fonts-dejavu-core
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the package alone (no dev group, so no gmsh / scikit-fem / scipy / pyamg)
        run: |
          uv sync --locked --no-dev
          uv pip install pytest lib3mf
      - name: Stress analysis reports itself unavailable with an install hint
        run: |
          .venv/bin/python - <<'PY'
          import json, subprocess, sys
          out = subprocess.run([sys.executable, "-m", "cad", "capabilities", "--json"], capture_output=True, text=True)
          fea = json.loads(out.stdout)["result"]["stress_analysis"]
          assert not fea["available"] and "gmsh" in fea["missing"] and "install" in fea["install"], fea
          print(fea["install"])
          PY
      - name: Core tests (FEA tests skip themselves)
        run: .venv/bin/python -m pytest -q -ra --junitxml=junit.xml tests/test_part.py tests/test_engine_cli.py tests/test_fea.py tests/test_render.py
      - name: Report failed tests as annotations
        if: failure()
        run: python3 scripts/junit_annotations.py junit.xml

  release-install-as-documented:
    name: Install the published release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Find the latest published release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: "Step 1: Linux system libraries (the apt-get lines copied from the README)"
        if: steps.latest.outputs.tag != '' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          grep '^sudo apt-get install -y lib' README.md | tee /dev/stderr | bash -e
      - name: Install the published wheel with FEA
        if: steps.latest.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.latest.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --pattern install.sh --dir "$RUNNER_TEMP"
          sh "$RUNNER_TEMP/install.sh" --fea
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and render an installed example
        if: steps.latest.outputs.tag != ''
        run: |
          cad --version
          cad capabilities | tail -1 | grep 'stress analysis (cad fea): available'
          cad examples copy mounting_bracket "$RUNNER_TEMP/bracket" && cd "$RUNNER_TEMP/bracket"
          cad build && cad inspect && cad render --views iso
          ls renders/r1/*.png
          cad daemon stop

  install-as-documented:
    name: Build from source as the README says (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: "Step 1: prerequisites (the README's commands)"
        run: |
          command -v uv    || curl -LsSf https://astral.sh/uv/install.sh | sh
          command -v cargo || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: "Linux system libraries and compiler (the apt-get lines copied from the README)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          grep '^sudo apt-get install' README.md | tee /dev/stderr | bash -e
      - name: "scripts/install.sh --fea"
        run: scripts/install.sh --fea
      - name: "Step 3: check it, then a first model end to end"
        run: |
          cad --version
          cad capabilities | tail -1 | grep 'stress analysis (cad fea): available'
          cad examples copy mounting_bracket "$RUNNER_TEMP/bracket" && cd "$RUNNER_TEMP/bracket"
          cad build && cad inspect && cad render --views iso
          ls renders/r1/*.png
          cad daemon stop
